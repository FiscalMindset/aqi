[project]
name = "dhuan"
version = "0.1.0"
description = "Dhuan Detective: street-level PM2.5 estimation, source attribution and advice for Delhi-NCR"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Dhuan Detective contributors" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "mangum>=0.19,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "httpx>=0.27,<1.0",
    "tenacity>=8.3,<10.0",
    "h3>=4.1,<5.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=15,<20",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4",
    "opensearch-py>=2.6,<3.0",
    "boto3>=1.34,<2.0",
    "aws-lambda-powertools>=2.40,<4.0",
]

[project.optional-dependencies]
agents = ["strands-agents>=0.1,<1.0"]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-asyncio>=0.23,<1.0",
    "hypothesis>=6.100,<7.0",
    "schemathesis>=3.35,<4.0",
    "responses>=0.25,<1.0",
    "moto[dynamodb,s3,ses]>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "types-python-dateutil>=2.9",
    "boto3-stubs[essential]>=1.34,<2.0",
    "respx>=0.21,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dhuan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs docker containers (OpenSearch/LocalStack)",
    "contract: schemathesis contract tests",
    "live: hits real upstream APIs (gated by DHUAN_LIVE_TESTS=1)",
    "agent_eval: agent evaluation suite",
]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:dhuan.*"]

[tool.coverage.run]
source = ["src/dhuan"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "A", "ASYNC", "TID", "PTH", "RET", "ARG", "PL", "TRY", "ANN"]
ignore = [
    "PLR0912", "PLR0913", "PLR0915", "PLR2004", "TRY003", "ANN401",
    "S101", "A002", "RUF012", "PLR0911",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "PLR", "ARG", "SLF001", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
plugins = []
exclude = ["tests/", "build/"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "h3.*"]
ignore_missing_imports = true
