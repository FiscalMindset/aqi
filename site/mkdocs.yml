docs_dir: .
site_dir: ../site
site_name: Dhuan Detective
site_description: Street-level PM2.5 estimation, source attribution and advice for Delhi-NCR
site_url: https://fiscalmindset.github.io/aqi/
repo_url: https://github.com/FiscalMindset/aqi
repo_name: FiscalMindset/aqi
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Engineering:
      - Rules: RULES.md
      - Technology stack: TECHNOLOGY_STACK.md
      - Architecture: ARCHITECTURE.md
      - Algorithms: ALGORITHM.md
      - Backend: BACKEND.md
      - Frontend: FRONTEND.md
      - AWS: AWS.md
      - Data collection: DATA_COLLECTION.md
      - Data sources: DATA_SOURCES.md
  - Model:
      - Model card: MODEL_CARD.md
      - Model method: MODEL.md
      - Gradient boosting: GRADIENT_BOOSTING.md
  - Agents:
      - Design: AGENTS_DESIGN.md
  - API:
      - Reference: API.md
  - Quality:
      - Testing: TESTING.md
      - Security: SECURITY.md
  - Operations:
      - Deployment: DEPLOYMENT.md
      - Runbook: RUNBOOK.md
      - Cost: COST.md
      - Contributing: CONTRIBUTING.md
  - Demo:
      - Script: DEMO.md
      - Blog draft: BLOG.md
  - Decisions (ADRs):
      - ADR index: adr/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mermaid2:
      arguments:
        theme: dark
        securityLevel: loose

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FiscalMindset/aqi

copyright: Data attribution OpenAQ (CC BY 4.0) · © OpenStreetMap contributors (ODbL) · Open-Meteo · NASA FIRMS
