{
  "openapi": "3.0.3",
  "info": {
    "title": "Dhuan Detective",
    "description": "\n**Dhuan Detective API** \u2014 street-level PM2.5 estimation, upwind source\nattribution and plain-language advice for Delhi-NCR.\n\nEvery estimate is a model *estimate* with an uncertainty interval, never a\nmeasurement. Every response reports data age; stale data is served explicitly\nrather than invented.\n",
    "version": "0.1.0"
  },
  "paths": {
    "/health": {
      "get": {
        "tags": [
          "system"
        ],
        "summary": "Liveness probe",
        "operationId": "health_health_get",
        "responses": {
          "200": {
            "description": "Service is alive.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthOut"
                }
              }
            }
          }
        }
      }
    },
    "/ready": {
      "get": {
        "tags": [
          "system"
        ],
        "summary": "Readiness probe",
        "operationId": "ready_ready_get",
        "responses": {
          "200": {
            "description": "Per-component readiness breakdown.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReadyOut"
                }
              }
            }
          }
        }
      }
    },
    "/v1/sources": {
      "get": {
        "tags": [
          "sources"
        ],
        "summary": "Pollution sources near a point, optionally upwind-filtered",
        "operationId": "sources_v1_sources_get",
        "parameters": [
          {
            "name": "lat",
            "in": "query",
            "required": true,
            "schema": {
              "type": "number",
              "maximum": 90,
              "minimum": -90,
              "description": "Latitude (WGS84)",
              "title": "Lat"
            },
            "description": "Latitude (WGS84)"
          },
          {
            "name": "lon",
            "in": "query",
            "required": true,
            "schema": {
              "type": "number",
              "maximum": 180,
              "minimum": -180,
              "description": "Longitude (WGS84)",
              "title": "Lon"
            },
            "description": "Longitude (WGS84)"
          },
          {
            "name": "radius_km",
            "in": "query",
            "required": false,
            "schema": {
              "type": "number",
              "maximum": 50,
              "minimum": 0.1,
              "description": "Search radius in km",
              "default": 15.0,
              "title": "Radius Km"
            },
            "description": "Search radius in km"
          },
          {
            "name": "upwind",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "description": "Only sources within the upwind cone",
              "default": true,
              "title": "Upwind"
            },
            "description": "Only sources within the upwind cone"
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 100,
              "minimum": 1,
              "default": 20,
              "title": "Limit"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "anyOf": [
                  {
                    "$ref": "#/components/schemas/Settings"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Settings"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Ranked candidate sources with distance, bearing and influence.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SourcesResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/stations": {
      "get": {
        "tags": [
          "stations"
        ],
        "summary": "Nearest CPCB/OpenAQ stations with latest PM2.5",
        "operationId": "stations_v1_stations_get",
        "parameters": [
          {
            "name": "lat",
            "in": "query",
            "required": true,
            "schema": {
              "type": "number",
              "maximum": 90,
              "minimum": -90,
              "description": "Latitude",
              "title": "Lat"
            },
            "description": "Latitude"
          },
          {
            "name": "lon",
            "in": "query",
            "required": true,
            "schema": {
              "type": "number",
              "maximum": 180,
              "minimum": -180,
              "description": "Longitude",
              "title": "Lon"
            },
            "description": "Longitude"
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 50,
              "minimum": 1,
              "description": "Maximum stations",
              "default": 10,
              "title": "Limit"
            },
            "description": "Maximum stations"
          }
        ],
        "responses": {
          "200": {
            "description": "Stations ordered by distance, with reading age and category.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/StationOut"
                  },
                  "title": "Response Stations V1 Stations Get"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/status": {
      "get": {
        "tags": [
          "status"
        ],
        "summary": "System status: feed freshness, versions, coverage",
        "operationId": "status_v1_status_get",
        "responses": {
          "200": {
            "description": "Feed records, model/API versions and coverage bounds.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StatusOut"
                }
              }
            }
          }
        }
      }
    },
    "/v1/estimate": {
      "get": {
        "tags": [
          "estimate"
        ],
        "summary": "PM2.5 estimate with 80% interval for a point in Delhi-NCR",
        "operationId": "estimate_v1_estimate_get",
        "parameters": [
          {
            "name": "lat",
            "in": "query",
            "required": true,
            "schema": {
              "type": "number",
              "maximum": 90,
              "minimum": -90,
              "title": "Lat"
            }
          },
          {
            "name": "lon",
            "in": "query",
            "required": true,
            "schema": {
              "type": "number",
              "maximum": 180,
              "minimum": -180,
              "title": "Lon"
            }
          },
          {
            "name": "explain",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "description": "Include the per-parameter contribution breakdown. Costs one extra batched model pass, so it is opt-in: the agent and the hot path do not need it.",
              "default": false,
              "title": "Explain"
            },
            "description": "Include the per-parameter contribution breakdown. Costs one extra batched model pass, so it is opt-in: the agent and the hot path do not need it."
          }
        ],
        "responses": {
          "200": {
            "description": "Estimate, interval, category, nearest station, freshness.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EstimateOut"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/grid": {
      "get": {
        "tags": [
          "grid"
        ],
        "summary": "Latest H3 res-8 grid for Delhi-NCR as GeoJSON",
        "operationId": "grid_v1_grid_get",
        "parameters": [
          {
            "name": "simplify",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "description": "Omit per-cell polylines (ids only)",
              "default": false,
              "title": "Simplify"
            },
            "description": "Omit per-cell polylines (ids only)"
          }
        ],
        "responses": {
          "200": {
            "description": "GeoJSON FeatureCollection of grid cells (ETag cached).",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/validation": {
      "get": {
        "tags": [
          "validation"
        ],
        "summary": "Latest evaluation metrics generated by model/evaluate.py",
        "operationId": "validation_v1_validation_get",
        "responses": {
          "200": {
            "description": "Temporal holdout, LOSO, baselines and the shipped winner.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ValidationOut"
                }
              }
            }
          }
        }
      }
    },
    "/v1/explain": {
      "post": {
        "tags": [
          "explain"
        ],
        "summary": "Explain the air at a point with visible, cited evidence",
        "operationId": "explain_route_v1_explain_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ExplainRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Attribution result, a citation-grounded explanation, persona advice, the retrieval trace, and any evidence gaps.",
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": true,
                  "type": "object",
                  "title": "Response Explain Route V1 Explain Post"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/subscriptions": {
      "post": {
        "tags": [
          "subscriptions"
        ],
        "summary": "Subscribe to air-quality alerts for a locality",
        "operationId": "create_subscription_v1_subscriptions_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SubscriptionRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Created (or already existing) subscription id.",
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": true,
                  "type": "object",
                  "title": "Response Create Subscription V1 Subscriptions Post"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/subscriptions/confirm": {
      "get": {
        "tags": [
          "subscriptions"
        ],
        "summary": "Confirm a subscription from the email link",
        "operationId": "confirm_subscription_v1_subscriptions_confirm_get",
        "parameters": [
          {
            "name": "id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 4,
              "title": "Id"
            }
          },
          {
            "name": "token",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 4,
              "title": "Token"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true,
                  "title": "Response Confirm Subscription V1 Subscriptions Confirm Get"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/subscriptions/unsubscribe": {
      "get": {
        "tags": [
          "subscriptions"
        ],
        "summary": "One-click unsubscribe from an alert email link",
        "description": "Unsubscribe by clicking the link at the bottom of an alert.\n\nA GET is deliberate: mail clients and webmail scanners follow links without\na session, and a confirmation click is already the user's intent.",
        "operationId": "unsubscribe_by_token_v1_subscriptions_unsubscribe_get",
        "parameters": [
          {
            "name": "token",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "title": "Token"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "A confirmation page; nothing is emailed.",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/subscriptions/{id}": {
      "delete": {
        "tags": [
          "subscriptions"
        ],
        "summary": "Unsubscribe (immediate, no confirmation email needed)",
        "operationId": "delete_subscription_v1_subscriptions__id__delete",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Id"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true,
                  "title": "Response Delete Subscription V1 Subscriptions  Id  Delete"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/model": {
      "get": {
        "tags": [
          "model"
        ],
        "summary": "Model card: algorithm, held-out accuracy, training provenance",
        "operationId": "model_card_v1_model_get",
        "responses": {
          "200": {
            "description": "Everything needed to judge the estimate.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModelCardOut"
                }
              }
            }
          }
        }
      }
    },
    "/v1/alerts/preview": {
      "post": {
        "tags": [
          "alerts"
        ],
        "summary": "Render the alert email for a point (no email is sent)",
        "operationId": "preview_alert_v1_alerts_preview_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AlertPreviewRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Subject, plain-text body and responsive HTML.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AlertPreviewResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/routes/compare": {
      "post": {
        "tags": [
          "routes"
        ],
        "summary": "Compare real road routes by estimated PM2.5 exposure",
        "operationId": "compare_routes_v1_routes_compare_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RouteCompareRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Corridors ranked cleanest first, with a sampled profile.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RouteCompareResponse"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "AlertPreviewRequest": {
        "properties": {
          "lat": {
            "type": "number",
            "maximum": 90.0,
            "minimum": -90.0,
            "title": "Lat"
          },
          "lon": {
            "type": "number",
            "maximum": 180.0,
            "minimum": -180.0,
            "title": "Lon"
          },
          "locality": {
            "type": "string",
            "maxLength": 120,
            "title": "Locality",
            "default": ""
          },
          "threshold_category": {
            "type": "string",
            "maxLength": 32,
            "title": "Threshold Category",
            "default": "Poor"
          },
          "causes": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 8,
            "title": "Causes"
          },
          "advice": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 400
              },
              {
                "type": "null"
              }
            ],
            "title": "Advice"
          },
          "unsubscribe_token": {
            "type": "string",
            "maxLength": 64,
            "title": "Unsubscribe Token",
            "default": ""
          }
        },
        "type": "object",
        "required": [
          "lat",
          "lon"
        ],
        "title": "AlertPreviewRequest",
        "description": "Render the alert email for a point without sending anything."
      },
      "AlertPreviewResponse": {
        "properties": {
          "subject": {
            "type": "string",
            "title": "Subject"
          },
          "body": {
            "type": "string",
            "title": "Body"
          },
          "html": {
            "type": "string",
            "title": "Html"
          }
        },
        "type": "object",
        "required": [
          "subject",
          "body",
          "html"
        ],
        "title": "AlertPreviewResponse"
      },
      "Bbox": {
        "properties": {
          "min_lat": {
            "type": "number",
            "title": "Min Lat"
          },
          "min_lon": {
            "type": "number",
            "title": "Min Lon"
          },
          "max_lat": {
            "type": "number",
            "title": "Max Lat"
          },
          "max_lon": {
            "type": "number",
            "title": "Max Lon"
          }
        },
        "type": "object",
        "required": [
          "min_lat",
          "min_lon",
          "max_lat",
          "max_lon"
        ],
        "title": "Bbox",
        "description": "An inclusive bounding box, min == south/west, max == north/east."
      },
      "EstimateOut": {
        "properties": {
          "lat": {
            "type": "number",
            "title": "Lat"
          },
          "lon": {
            "type": "number",
            "title": "Lon"
          },
          "ts_utc": {
            "type": "string",
            "title": "Ts Utc"
          },
          "pm25_low": {
            "type": "number",
            "title": "Pm25 Low"
          },
          "pm25_mid": {
            "type": "number",
            "title": "Pm25 Mid"
          },
          "pm25_high": {
            "type": "number",
            "title": "Pm25 High"
          },
          "category": {
            "type": "string",
            "title": "Category"
          },
          "aqi_sub_index": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "title": "Aqi Sub Index"
          },
          "nearest_station_pm25": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Nearest Station Pm25"
          },
          "nearest_station_name": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Nearest Station Name"
          },
          "data_age_seconds": {
            "type": "number",
            "title": "Data Age Seconds"
          },
          "stale": {
            "type": "boolean",
            "title": "Stale"
          },
          "model_version": {
            "type": "string",
            "title": "Model Version"
          },
          "served_by": {
            "type": "string",
            "title": "Served By"
          },
          "cpcb_table_version": {
            "type": "string",
            "title": "Cpcb Table Version"
          },
          "honesty": {
            "type": "string",
            "title": "Honesty"
          },
          "persistence_anchor_ugm3": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Persistence Anchor Ugm3"
          },
          "model_adjustment_ugm3": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Model Adjustment Ugm3"
          },
          "features_used": {
            "items": {
              "$ref": "#/components/schemas/FeatureContribution"
            },
            "type": "array",
            "title": "Features Used",
            "default": []
          },
          "method": {
            "type": "string",
            "title": "Method",
            "default": "persistence-baseline"
          }
        },
        "type": "object",
        "required": [
          "lat",
          "lon",
          "ts_utc",
          "pm25_low",
          "pm25_mid",
          "pm25_high",
          "category",
          "data_age_seconds",
          "stale",
          "model_version",
          "served_by",
          "cpcb_table_version",
          "honesty"
        ],
        "title": "EstimateOut",
        "description": "PM2.5 estimate with an 80% interval and full honesty block."
      },
      "ExplainRequest": {
        "properties": {
          "lat": {
            "type": "number",
            "maximum": 90.0,
            "minimum": -90.0,
            "title": "Lat"
          },
          "lon": {
            "type": "number",
            "maximum": 180.0,
            "minimum": -180.0,
            "title": "Lon"
          }
        },
        "type": "object",
        "required": [
          "lat",
          "lon"
        ],
        "title": "ExplainRequest"
      },
      "FeatureContribution": {
        "properties": {
          "name": {
            "type": "string",
            "title": "Name"
          },
          "value": {
            "type": "number",
            "title": "Value"
          },
          "unit": {
            "type": "string",
            "title": "Unit"
          },
          "reference": {
            "type": "number",
            "title": "Reference"
          },
          "contribution_ugm3": {
