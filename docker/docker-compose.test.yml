version: "3.9"

name: dhuan-test

services:
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: dhuan-test-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    networks: [dhuan-test]

  localstack:
    image: localstack/localstack:4.3
    container_name: dhuan-test-localstack
    environment:
      - SERVICES=dynamodb,s3,sns,ses,events,stepfunctions,cloudwatch,ssm,secretsmanager
      - DEBUG=0
      - PERSISTENCE=0
      - AWS_DEFAULT_REGION=ap-south-1
    ports:
      - "4567:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4567/_localstack/health | grep -q dynamodb || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
    networks: [dhuan-test]

networks:
  dhuan-test:
    name: dhuan-test
