AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Dhuan Detective - street-level PM2.5 estimation, source attribution and advice
  for Delhi-NCR. API (FastAPI container on Lambda), Step Functions pipeline,
  DynamoDB tables, SNS alerts, S3 + CloudFront web hosting.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  BedrockModelId:
    Type: String
    Description: Bedrock model id for the agents (never hardcoded; set per deployment).

  OpensearchEndpoint:
    Type: String
    Default: ""
    Description: >
      OpenSearch domain endpoint. Optional: when empty the API serves source
      lookups from the static OSM extract bundled in the image (smaller,
      coarser) and reports sources_unavailable instead of inventing data.
  DemoMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Serve recorded OpenAQ archive readings from the image instead of calling
      the live feed. Every response is tagged demo_mode:true and the web app
      shows a permanent banner. Turn this off once OPENAQ_API_KEY is stored in
      SSM under /dhuan/openaq-api-key.
  EnableWebCdn:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Create the CloudFront distribution in front of the web bucket. A brand
      new AWS account is rejected with "Your account must be verified before you
      can add new CloudFront resources", which fails the whole stack. Keep it
      false until the account is verified, then deploy with true and set the web
      app's VITE_API_BASE to the API URL output.
  WebBucketName:
    Type: String
    Default: ""
    Description: >
      S3 bucket for the built web app. Leave empty to let CloudFormation
      generate a unique name; the value is published as the WebBucket output
      and the CD workflow syncs dist/ into it.
# Canary deployment note: SAM's transform requires a literal
# DeploymentPreference.Type, so it cannot be switched on with Fn::If. On an
# account without CodeDeploy enabled ("The AWS Access Key Id needs a
# subscription for the service") the stack fails to create, so the property is
# omitted here. Rollback safety comes from AutoPublishAlias plus the smoke test
# in scripts/smoke.py. See docs/DEPLOYMENT.md for the canary overlay.
#
# Custom domains are not wired yet. The API is served through the default
# execute-api hostname, which API Gateway already TLS-terminates, and the web
# app through its CloudFront distribution (see the WebUrl output). Adding a
# custom domain later means: ACM cert in us-east-1, an API Gateway DomainName,
# and a Route 53 alias - not a change to the functions themselves.

Conditions:
  WebBucketNameProvided: !Not [!Equals [!Ref WebBucketName, ""]]
  WebCdnEnabled: !Equals [!Ref EnableWebCdn, "true"]
  WebCdnDisabled: !Equals [!Ref EnableWebCdn, "false"]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    # container image functions: no Runtime here (image owns it)
    Environment:
      Variables:
        ENV: !Ref Environment
        LOG_LEVEL: INFO
        DEMO_MODE: !Ref DemoMode
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        OPENSEARCH_ENDPOINT: !Ref OpensearchEndpoint
        OPENSEARCH_INDEX: sources
        DYNAMODB_TABLE_ESTIMATES: !Ref EstimatesTable
        DYNAMODB_TABLE_FEEDS: !Ref FeedsTable
        DYNAMODB_TABLE_SUBSCRIPTIONS: !Ref SubscriptionsTable
        S3_BUCKET: !Ref ArtifactsBucket
        MODEL_VERSION: baseline-v1
        H3_RESOLUTION: "8"
        SMS_ENABLED: "0"
        POWERTOOLS_SERVICE_NAME: dhuan-detective

Resources:
  # ---------------------------------------------------------------- tables --
  EstimatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub dhuan-estimates-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  FeedsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub dhuan-feeds-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub dhuan-subscriptions-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: locality, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: locality-index
          KeySchema:
            - {AttributeName: locality, KeyType: HASH}
          Projection:
            ProjectionType: ALL

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub dhuan-artifacts-${Environment}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: RawDataExpiry
            Status: Enabled
            ExpirationInDays: 90
            Prefix: raw/

  # ------------------------------------------------------------- web + CDN --
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - WebBucketNameProvided
        - !Ref WebBucketName
        - !Ref AWS::NoValue
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      # Website hosting is what makes the app usable before CloudFront is
      # available: the REST endpoint does not resolve "/" to index.html, so
      # https://bucket.s3.<region>.amazonaws.com/ returns 403 and every deep
      # link 403s as well, which the React router surfaces as
      # "Unexpected Application Error! 404 Not Found".
      # ErrorDocument: index.html gives the SPA the catch-all it needs for
      # client-side routes (/methodology, /subscribe, ...).
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  # Without the CDN (accounts that are not yet verified cannot create
  # CloudFront distributions) the bucket itself must serve the site, so grant
  # anonymous reads. A PWA contains no secrets, and the bucket holds only
  # build output, so this is safe for staging. When the CDN is enabled this
  # policy is replaced by WebBucketPolicy (OAC-signed access).
  WebBucketPublicReadPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: WebCdnDisabled
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadStagingWebApp
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: WebCdnEnabled
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: WebCdnEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub dhuan-detective-web-${Environment}
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref WebOAC
          - Id: api
            DomainName: !Sub ${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CacheBehaviors:
          # The API is served under /<stage>/v1/*, not /v1/*
          - PathPattern: /staging/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5f1b7b0e4b
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: WebCdnEnabled
    Properties:
      OriginAccessControlConfig:
        Name: !Sub dhuan-web-oac-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ------------------------------------------------------------------- API --
  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub dhuan-api-${Environment}
      EndpointConfiguration:
        Types: [REGIONAL]
      # Mangum returns isBase64Encoded=false with content-type application/json,
      # but a REST API with no BinaryMediaTypes entry still base64-wraps the body
      # for ANY-proxy integrations. '*/*' makes API Gateway pass it through verbatim.
      BinaryMediaTypes:
        - "*/*"

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub dhuan-usage-plan-${Environment}
      Throttle:
        BurstLimit: 40
        RateLimit: 20
      Quota:
        Limit: 20000
        Period: DAY
      ApiStages:
        - ApiId: !Ref ApiGatewayRestApi
          Stage: !Ref ApiStage

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      # The stage name becomes part of every public URL
      # (https://<api-id>.execute-api.<region>.amazonaws.com/<stage>/<path>).
      # Naming it "v1" collides with the application's own /v1 route prefix:
      # a request for /v1/estimate is then read as stage "v1" + path "/estimate",
      # which the FastAPI app does not serve -> 404 on every /v1/* route. Using
      # the environment name keeps the URL honest: /staging/v1/estimate.
      StageName: !Ref Environment
      RestApiId: !Ref ApiGatewayRestApi
      DeploymentId: !Ref ApiDeployment
      MethodSettings:
        - ResourcePath: /v1/explain
          HttpMethod: POST
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        - ResourcePath: /v1/estimate
          HttpMethod: GET
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  # A Deployment snapshots the API as it is at creation time. Without the
  # DependsOn, CloudFormation creates it in parallel with the Method (it only
  # Refs the RestApi) and the race produces:
  #   "The REST API doesn't contain any methods (Service: ApiGateway, 400)"
  # because the snapshot was taken before any method existed.
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayMethod
      - ApiGatewayRootMethod
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      Description: Dhuan Detective API deployment

  ApiGatewayResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: '{proxy+}'

  ApiGatewayMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  # {proxy+} requires at least one path segment, so GET / would 403 without
  # this root-level ANY method.
  ApiGatewayRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !GetAtt ApiGatewayRestApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*

  # ------------------------------------------------------------- functions --
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: backend/Dockerfile
      DockerContext: ..
    Properties:
      FunctionName: !Sub dhuan-api-${Environment}
      PackageType: Image
      MemorySize: 1024
      Timeout: 30
      Architectures: [arm64]
      AutoPublishAlias: live
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:*
              Resource:
                - !GetAtt EstimatesTable.Arn
                - !GetAtt FeedsTable.Arn
                - !GetAtt SubscriptionsTable.Arn
                - !Sub ${SubscriptionsTable.Arn}/index/locality-index
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub ${ArtifactsBucket.Arn}/*
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertTopic
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dhuan/*
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: '*'

  PipelineFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: backend/Dockerfile
      DockerContext: ..
    Properties:
      FunctionName: !Sub dhuan-pipeline-${Environment}
      PackageType: Image
      MemorySize: 2048
      Timeout: 900
      Architectures: [arm64]
      Environment:
        Variables:
          CMD: pipeline
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref EstimatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedsTable
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertTopic

  StateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub dhuan-pipeline-${Environment}
      DefinitionUri: state-machine.asl.json
      # With DefinitionUri, CloudFormation does NOT run Fn::Sub over the file -
      # it only replaces the keys listed here. The ASL therefore references a
      # single ${PipelineFunctionArn}; the earlier ${AWS::Region} /
      # ${AWS::AccountId} placeholders survived into the deployed definition and
      # failed at runtime with "The resource belongs to a different region from
      # the running execution. Expected 'ap-south-1', was '${AWS".
      DefinitionSubstitutions:
        PipelineFunctionArn: !GetAtt PipelineFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PipelineFunction

  PipelineSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub dhuan-hourly-${Environment}
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !Ref StateMachine
          Id: dhuan-hourly
          RoleArn: !GetAtt PipelineEventsRole.Arn

  SourceRefreshSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub dhuan-source-refresh-${Environment}
      ScheduleExpression: rate(30 days)
      State: ENABLED
      Targets:
        # EventBridge needs the function ARN; !Ref on a Function returns its
        # name, which EventBridge rejects with "Provided Arn is not in correct
        # format" (400).
        - Arn: !GetAtt PipelineFunction.Arn
          Id: dhuan-source-refresh
          Input: '{"task": "refresh_sources"}'
          RoleArn: !GetAtt PipelineEventsRole.Arn

  PipelineEventsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref StateMachine
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PipelineFunction.Arn

  # ----------------------------------------------------------------- SNS ---
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub dhuan-alerts-${Environment}
      DisplayName: Dhuan Detective air-quality alerts

  # ------------------------------------------------------------- DLQ + alarms
  PipelineDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub dhuan-pipeline-dlq-${Environment}

  PipelineDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dhuan-pipeline-dlq-depth-${Environment}
      AlarmDescription: DLQ depth grew; failed executions need inspection (see RUNBOOK)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PipelineDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dhuan-api-errors-${Environment}
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: >-
      Public API base URL. The API itself is always served by API Gateway; the
      CloudFront domain in front of the web app is separate (see WebUrl).
    Value: !Sub https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/v1

  WebUrl:
    Description: Web app URL, or the raw S3 origin when the CDN is disabled.
    Value: !If
      - WebCdnEnabled
      - !Sub https://${WebDistribution.DomainName}
      - !Sub http://${WebBucket.RegionalDomainName}

  IsWebCdnEnabled:
    Description: Whether the CloudFront distribution was created ("true"/"false").
    Value: !Ref EnableWebCdn

  StateMachineArn:
    Value: !Ref StateMachine

  AlertTopicArn:
    Value: !Ref AlertTopic
