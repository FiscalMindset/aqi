name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden-tokens:
    name: Forbidden tokens (rule 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep src for forbidden tokens
        run: |
          set -e
          PATTERN='TODO|FIXME|XXX|NotImplementedError|lorem ipsum'
          if grep -rInE "$PATTERN" backend/src frontend/src 2>/dev/null; then
            echo "::error::Forbidden tokens found in src"
            exit 1
          fi
          echo "no forbidden tokens in src"

  lint-format:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project backend --extra dev
      - name: ruff
        run: uv run --project backend ruff check backend/src backend/tests
      - name: ruff format check
        run: uv run --project backend ruff format --check backend/src backend/tests
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: eslint
        run: |
          cd frontend && npm ci && npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project backend --extra dev
      - run: uv run --project backend mypy --strict backend/src
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run typecheck

  unit-tests:
    name: Unit tests (backend + model + agent)
    runs-on: ubuntu-latest
    needs: [forbidden-tokens]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project backend --extra dev
      - name: Unit + model + agent evals with coverage
        run: |
          cd backend
          uv run pytest tests/unit tests/model tests/agent_evals \
            --cov=src/dhuan --cov-report=term --cov-report=xml -q
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  integration-tests:
    name: Integration tests (containers)
    runs-on: ubuntu-latest
    needs: [forbidden-tokens]
    services:
      opensearch:
        image: opensearchproject/opensearch:2.18.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports: ["9201:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 30
      localstack:
        image: localstack/localstack:4.3
        env:
          SERVICES: dynamodb,s3,sns,ses,events,stepfunctions,cloudwatch,ssm
        ports: ["4567:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4567/_localstack/health || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project backend --extra dev
      - name: Integration tests
        run: cd backend && uv run pytest tests/integration -q -m integration

  contract-tests:
    name: Contract tests (Schemathesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project backend --extra dev
      - run: cd backend && uv run pytest tests/contract -q

  openapi-drift:
    name: OpenAPI drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project backend --extra dev
      - name: Regenerate and diff
        run: |
          cd backend && uv run python -m dhuan.api.openapi_gen
          cd ..
          if ! git diff --exit-code openapi/openapi.yaml; then
            echo "::error::openapi.yaml drifted; commit the regenerated spec"
            exit 1
          fi

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run test:unit

  e2e-tests:
    name: Playwright e2e matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps ${{ matrix.project }}
      - run: cd frontend && npx playwright test --project=${{ matrix.project }}

  lighthouse:
    name: Lighthouse budgets (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build && npm install -D @lhci/cli
      - run: cd frontend && npx lhci autorun

  iac-validation:
    name: IaC validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: cfn-lint
        run: |
          pip install cfn-lint
          cfn-lint infra/template.yaml
      - name: ASL JSON valid
        run: python -c "import json; json.load(open('infra/state-machine.asl.json')); print('ASL ok')"
      - name: pip-audit
        run: |
          pip install pip-audit
          uv sync --project backend --extra dev
          pip-audit -r <(uv export --project backend --extra dev --no-hashes --format requirements-txt) || true

  security-scan:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install bandit
          bandit -r backend/src -ll -ii
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit
        run: |
          cd frontend && npm ci && npm audit --audit-level=high || true

  docker-build:
    name: Docker build + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t dhuan-backend ./backend
      - name: Build frontend image
        run: docker build -t dhuan-frontend ./frontend
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24
        with:
          image-ref: dhuan-backend
          severity: HIGH,CRITICAL
          exit-code: "1"

  docs-strict:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install mkdocs-material mkdocs-mermaid2-plugin pymdown-extensions
          mkdocs build --strict -f docs/mkdocs.yml
