name: Bug report
description: Something is wrong or inconsistent
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the request/route and the response }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected }
  - type: input
    id: env
    attributes: { label: Environment (dev/staging/prod, browser) }
