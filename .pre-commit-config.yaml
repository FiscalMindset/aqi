repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=5120"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/src/
      - id: ruff-format
        files: ^backend/src/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^backend/src/
        additional_dependencies: [pydantic, types-python-dateutil, boto3-stubs]
  - repo: local
    hooks:
      - id: forbidden-tokens
        name: forbidden tokens in src
        entry: bash -c 'grep -rInE "TODO|FIXME|XXX|NotImplementedError|lorem ipsum" backend/src frontend/src && exit 1 || exit 0'
        language: system
        pass_filenames: false
